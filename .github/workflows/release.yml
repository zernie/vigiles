name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Bounded 2026-08-19. Every job in this repository was unbounded, so a hung one
    # ran to GitHub's six-hour ceiling — the one failure mode a green checkmark
    # cannot show you, because it does not fail, it bills. Sizes are ~3-4x the
    # MEASURED duration on this repo's own runs, quoted per job so a later edit can
    # see where the number came from instead of guessing again.
    # not measured; publishes to npm, so bounded generously but bounded.
    timeout-minutes: 20
    # Skip release on commits that don't affect the package
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # 🔴 20 → 22 on 2026-08-16, because the release job DIED on this line and took a
          # major with it. `semantic-release` refuses to start on Node 20:
          #
          #   [semantic-release]: node version ^22.14.0 || >= 24.10.0 is required. Found v20.20.2.
          #
          # It fails BEFORE analysing a single commit, so `fix(release)!:` in #152 — the commit
          # that repaired the preset so `!` means major at all — never became v16.0.0. npm sat
          # at 15.4.1 while `main` carried breaking changes, which is the exact condition #152
          # existed to end.
          #
          # ⚠️ THE REAL DEFECT IS NOT THIS NUMBER. `semantic-release` is not in package.json at
          # all, so `npx semantic-release` resolves the newest published version on every run.
          # The release pipeline therefore changes behaviour with no commit to this repository:
          # run 132 passed at 19:30 and run 133 failed at 21:24 on the same config, because a
          # release in between dropped Node 20. Bumping the runtime unblocks today and leaves
          # that open — pinning the tool as a devDependency is the fix that closes it.
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      - name: Update the Action's floating major-version tag
        # ── WHY THIS IS NOT DERIVED FROM THE PACKAGE VERSION ────────────────────
        # The GitHub Action and the npm package are versioned on DIFFERENT AXES.
        # The Action is a thin composite wrapper over `npx vigiles`; its own
        # interface is its inputs and outputs, every input is optional with a
        # default, and no input or output has ever been removed — so its major is
        # still 1, while the package is on 26.
        #
        # Until 2026-09-07 this step computed `major="${latest%%.*}"` from the
        # newest PACKAGE tag, so it moved `v26` and could NEVER move `v1`. But
        # `vigiles init` emits `uses: zernie/vigiles@v1` (src/cli-main.ts) and
        # docs/github-action.md tells users to pin that — and no `v1` ref exists,
        # so the first PR a new user opened after `init` failed with
        # "Unable to resolve action zernie/vigiles@v1". CI never noticed because
        # this repo dogfoods the Action as `uses: ./`, which resolves no ref at
        # all. The contract the docs describe is the right one; this step now
        # implements it. Kept honest by src/action-major-tag.test.ts, which reads
        # ACTION_MAJOR_TAG below and the ref `init` emits and fails if they differ.
        #
        # The v2…v26 floating tags left behind by the old logic are NOT deleted —
        # someone may have copied a pinned example. They are simply frozen at
        # whatever release last moved them, which is a valid immutable pin. Only
        # ACTION_MAJOR_TAG moves from here on.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The ACTION's major version — bump this only on a breaking change to
          # action.yml's inputs/outputs, never because the npm package majored.
          ACTION_MAJOR_TAG: v1
        run: |
          set -euo pipefail
          case "$ACTION_MAJOR_TAG" in
            v[0-9]*) ;;
            *) echo "::error::ACTION_MAJOR_TAG must look like vN, got '$ACTION_MAJOR_TAG'"; exit 1 ;;
          esac
          git fetch --tags --force
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            echo "No version tags yet — skipping major-tag update."
            exit 0
          fi
          # Peel both sides to a COMMIT so the comparison and the write agree even
          # if semantic-release ever starts producing annotated tags (today's are
          # lightweight, so this is a no-op — and that is the point: it stays a
          # no-op instead of re-pushing the same tag forever).
          target="$(git rev-parse "$latest^{commit}")"
          current="$(git rev-parse -q --verify "refs/tags/$ACTION_MAJOR_TAG^{commit}" || true)"
          if [ "$current" = "$target" ]; then
            echo "$ACTION_MAJOR_TAG already points at $latest ($target) — nothing to do."
            exit 0
          fi
          echo "Pointing $ACTION_MAJOR_TAG at $latest ($target)"
          git tag -f "$ACTION_MAJOR_TAG" "$target"
          git push origin -f "refs/tags/$ACTION_MAJOR_TAG"
