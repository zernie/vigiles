name: Pages (landing + API docs)

# ONE GitHub Pages deploy for the whole site, since a repo gets only one Pages
# site. Layout:
#   /      → the marketing landing (site/, Vite + React + shadcn)
#   /api/  → the generated API reference (TypeDoc)
#
# Replaces the old separate api-docs.yml (docs at root) + the build-only site.yml.
#
# REQUIRED ONE-TIME SETUP (repo admin, can't be done from code):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Publishes at https://zernie.github.io/vigiles/ (landing) + /vigiles/api/ (docs).
# For the vigiles.sh custom domain: the artifact ships a CNAME file (step 3), so
# once the DNS A records point at GitHub Pages and Settings → Pages shows the
# domain, it serves at https://vigiles.sh/ + /api/ — the landing's relative asset
# base ("./") and TypeDoc's relative links both work at either path.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Bounded 2026-08-19. Every job in this repository was unbounded, so a hung one
    # ran to GitHub's six-hour ceiling — the one failure mode a green checkmark
    # cannot show you, because it does not fail, it bills. Sizes are ~3-4x the
    # MEASURED duration on this repo's own runs, quoted per job so a later edit can
    # see where the number came from instead of guessing again.
    # not measured here; sized like `site`, which builds the same assets.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # 0) Build the root package FIRST → produces the compiled engine in `dist/`.
      #    The landing's live audit demo imports it (dist/scan-files.js +
      #    dist/audit-report.js) via the site's `@engine/*` Vite aliases, and `dist/`
      #    is a build artifact (gitignored), so the site build below can't resolve
      #    those imports without this step.
      - name: Build engine (root dist/)
        run: npm run build

      # 1) Landing → the Pages ROOT (Vite base "./" → works at / or a subpath).
      #    site/ is an npm workspace, so its deps come from the root `npm ci`
      #    above — build it via the workspace (no per-package `npm ci`).
      - name: Build landing (site/)
        run: npm run build --workspace @vigiles/site

      # 2) API reference (TypeDoc) → self-contained api-reference/ (incl. .nojekyll).
      - name: Generate API reference (TypeDoc)
        run: npx typedoc

      # 3) Assemble one artifact: landing at /, docs at /api.
      - name: Assemble Pages artifact
        run: |
          rm -rf _pages && mkdir -p _pages/api
          cp -r site/dist/. _pages/
          cp -r api-reference/. _pages/api/
          touch _pages/.nojekyll
          # Pin the custom domain in the artifact so an Actions-based deploy keeps
          # it across runs (a domain set only in Settings → Pages can be dropped on
          # redeploy; the CNAME file is the durable source). Serves at https://vigiles.sh/.
          echo 'vigiles.sh' > _pages/CNAME

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _pages

      - id: deploy
        uses: actions/deploy-pages@v5
